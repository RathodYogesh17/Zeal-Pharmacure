<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 350" width="100%" height="100%">
  <defs>
    <!-- Jar glass / dark chocolate body -->
    <radialGradient id="jarBody" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="60%" stop-color="#271102" />
      <stop offset="100%" stop-color="#0F0500" />
    </radialGradient>
    <!-- Gold / bronze lid -->
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#D97706" />
      <stop offset="70%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <!-- Box packaging -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B1C0A" />
      <stop offset="100%" stop-color="#1A0C04" />
    </linearGradient>
    <filter id="jarShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F0500" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Box behind jar -->
  <g transform="translate(40, 50)" filter="url(#jarShadow)">
    <rect x="0" y="0" width="170" height="200" rx="10" fill="url(#boxGrad)" stroke="#78350F" stroke-width="2" />
    <rect x="15" y="20" width="140" height="4" fill="#F59E0B" />
    <text x="85" y="55" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#FDE68A" text-anchor="middle">mCaffeine</text>
    <text x="85" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#D97706" text-anchor="middle">NAKED &amp; RICH</text>
    <text x="85" y="105" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">CHOCO</text>
    <text x="85" y="125" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0" text-anchor="middle">Body Butter</text>
    <rect x="25" y="150" width="120" height="24" rx="12" fill="#78350F" />
    <text x="85" y="166" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FDE68A" text-anchor="middle">Caramel Nourish</text>
  </g>

  <!-- Open or closed Jar in front -->
  <g transform="translate(190, 80)" filter="url(#jarShadow)">
    <!-- Jar glass base -->
    <rect x="20" y="50" width="190" height="150" rx="30" fill="url(#jarBody)" stroke="#78350F" stroke-width="2" />
    <!-- Lid -->
    <rect x="10" y="20" width="210" height="38" rx="12" fill="url(#lidGrad)" stroke="#B45309" stroke-width="2" />
    <!-- Lid ridges -->
    <line x1="20" y1="20" x2="20" y2="58" stroke="#FDE68A" stroke-width="1.5" opacity="0.6" />
    <line x1="210" y1="20" x2="210" y2="58" stroke="#78350F" stroke-width="1.5" opacity="0.8" />
    
    <!-- Label on jar -->
    <rect x="35" y="75" width="160" height="95" rx="8" fill="#FFFBEB" />
    <text x="115" y="102" font-family="system-ui, sans-serif" font-size="17" font-weight="900" fill="#78350F" text-anchor="middle">mCaffeine</text>
    <text x="115" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#92400E" text-anchor="middle">CHOCO BODY BUTTER</text>
    <text x="115" y="140" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">With Cocoa Butter &amp; Caramel</text>
    <rect x="55" y="148" width="120" height="16" rx="8" fill="#FEF3C7" />
    <text x="115" y="159" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#92400E" text-anchor="middle">Deep 72h Moisture</text>
  </g>
</svg>
