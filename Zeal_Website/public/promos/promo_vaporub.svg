<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="balmBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="45%" stop-color="#0D9488" />
      <stop offset="85%" stop-color="#115E59" />
      <stop offset="100%" stop-color="#042F2E" />
    </radialGradient>
    <linearGradient id="lidRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <filter id="tinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#042F2E" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <radialGradient id="tinHighlight" cx="30%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container shadow & outer rim -->
  <circle cx="200" cy="200" r="150" fill="url(#lidRing)" filter="url(#tinShadow)" />
  <circle cx="200" cy="200" r="142" fill="url(#balmBg)" stroke="#14B8A6" stroke-width="3" />
  
  <!-- Inner circular ring -->
  <circle cx="200" cy="200" r="128" fill="none" stroke="#2DD4BF" stroke-width="2.5" opacity="0.6" stroke-dasharray="4 2" />
  
  <!-- Subtle highlight gloss -->
  <circle cx="200" cy="200" r="140" fill="url(#tinHighlight)" pointer-events="none" />

  <!-- Center brand badge -->
  <circle cx="200" cy="200" r="110" fill="#042F2E" fill-opacity="0.4" />
  
  <!-- Brand text -->
  <text x="200" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">VAPO-RUB</text>
  
  <rect x="135" y="180" width="130" height="22" rx="11" fill="#EF4444" />
  <text x="200" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">COLD &amp; COUGH RELIEF</text>
  
  <text x="200" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#A7F3D0" text-anchor="middle">Menthol • Camphor • Eucalyptus</text>
  <text x="200" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#5EEAD4" text-anchor="middle">POCKET PACK • 25ml</text>

  <!-- Star emblem -->
  <polygon points="200,126 204,136 215,136 206,142 209,152 200,146 191,152 194,142 185,136 196,136" fill="#FBBF24" />
</svg>
