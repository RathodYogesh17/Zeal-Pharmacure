<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="packGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="yellowBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="packShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Baby Diaper Pack 1 (Background slight tilt) -->
  <g transform="translate(40, 30) rotate(-6)" filter="url(#packShadow)">
    <rect x="0" y="0" width="190" height="250" rx="20" fill="url(#packGrad)" stroke="#BAE6FD" stroke-width="3" />
    <path d="M 0 20 Q 0 0 20 0 L 170 0 Q 190 0 190 20 L 190 60 L 0 60 Z" fill="url(#yellowBand)" />
    <path d="M 60 -15 Q 95 -30 130 -15" fill="none" stroke="#FBBF24" stroke-width="8" stroke-linecap="round" />
    
    <text x="95" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="900" fill="#78350F" text-anchor="middle">MamyPoko</text>
    <rect x="25" y="80" width="140" height="120" rx="14" fill="#FFFFFF" fill-opacity="0.9" />
    <circle cx="95" cy="120" r="30" fill="#FEF08A" />
    <text x="95" y="125" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">👶</text>
    <text x="95" y="170" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#0369A1" text-anchor="middle">Pants Extra Dry</text>
    <rect x="35" y="215" width="120" height="22" rx="11" fill="#0284C7" />
    <text x="95" y="230" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">12hr Absorption</text>
  </g>

  <!-- Baby Diaper Pack 2 (Foreground prominent) -->
  <g transform="translate(230, 20)" filter="url(#packShadow)">
    <rect x="0" y="0" width="210" height="270" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    
    <path d="M 0 22 Q 0 0 22 0 L 188 0 Q 210 0 210 22 L 210 75 L 0 75 Z" fill="#0284C7" />
    <path d="M 65 -15 Q 105 -35 145 -15" fill="none" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" />

    <text x="105" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">MamyPoko</text>
    <text x="105" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FDE047" text-anchor="middle">PEDIATRIC CARE</text>

    <circle cx="105" cy="140" r="48" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2" />
    <text x="105" y="152" font-family="system-ui, sans-serif" font-size="44" text-anchor="middle">🍼</text>

    <text x="105" y="210" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="middle">Active Comfort Fit</text>
    <text x="105" y="228" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle">Size L • Hospital Grade</text>

    <!-- Medical certification badge sticker -->
    <circle cx="180" cy="90" r="28" fill="#059669" filter="url(#packShadow)" />
    <text x="180" y="87" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">GMP</text>
    <text x="180" y="99" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">CLINICAL</text>
    <text x="180" y="109" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">GRADE</text>

    <rect x="30" y="242" width="150" height="20" rx="10" fill="#ECFDF5" />
    <text x="105" y="256" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#059669" text-anchor="middle">Dermatologically Certified</text>
  </g>
</svg>
